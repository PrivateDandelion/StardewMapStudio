name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm /111 | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager nicht gefunden in $SDK_ROOT"
            exit 1
          fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StardewMapStudio-v0.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish installable APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StardewMapStudio-v0.4.0-debug.apk
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release upload v0.4.0 StardewMapStudio-v0.4.0-debug.apk --clobber
          else
            gh release create v0.4.0 StardewMapStudio-v0.4.0-debug.apk --title "Stardew Map Studio v0.4.0 (Android)" --notes "Offline-Karteneditor für Stardew Valley mit getrennten Original- und Map-Tileset-Paletten. Debug-APK. Mod-/Vanilla-Assets bei Bedarf über den Dateidialog importieren." --target "$GITHUB_SHA"
          fi
